name: CI

on:
  push:
    branches: [main, feature/offline-first]
  pull_request:
    branches: [main]

env:
  FLUTTER_VERSION: '3.47.1'

permissions:
  contents: read

jobs:
  analyze_and_test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver
      - run: flutter analyze
      - run: flutter test

  firebase_emulators:
    name: Firebase unit & emulator tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --prefix functions
      - run: npm --prefix functions run lint
      - run: npm --prefix functions test
      - run: npm install --global firebase-tools@15.15.0
      - run: >
          firebase emulators:exec --project demo-loyalo-v2
          --only auth,firestore,functions,storage
          "npm --prefix functions run test:emulator"

  build_android:
    name: Build Android Pilot (APK)
    needs: [analyze_and_test, firebase_emulators]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-37"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: >
          flutter build apk --release --flavor pilot
          --dart-define=LOYALO_FIREBASE_ENV=pilot
          --dart-define=LOYALO_FIREBASE_PROJECT_ID=loyalo-pilot
          --dart-define=LOYALO_SECURE_APPROVE_CHECKIN=true
          --dart-define=LOYALO_SECURE_REJECT_CHECKIN=true
      - uses: actions/upload-artifact@v4
        with:
          name: loyalo-android-pilot-release
          path: build/app/outputs/flutter-apk/app-pilot-release.apk

  build_ios:
    name: Build iOS Pilot (no codesign)
    needs: [analyze_and_test, firebase_emulators]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: >
          flutter build ios --release --no-codesign --flavor pilot
          --dart-define=LOYALO_FIREBASE_ENV=pilot
          --dart-define=LOYALO_FIREBASE_PROJECT_ID=loyalo-pilot
          --dart-define=LOYALO_SECURE_APPROVE_CHECKIN=true
          --dart-define=LOYALO_SECURE_REJECT_CHECKIN=true
